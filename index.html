<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manychat AI Onboarding</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Geist', Roboto, sans-serif;
            background: #ffffff;
            color: #232b39;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Screen 1: Connect Instagram */
        .connect-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
        }

        .connect-screen.hidden {
            display: none;
        }

        .connect-content {
            text-align: center;
            max-width: 480px;
            z-index: 1;
        }

        .logo-container {
            width: 80px;
            height: 80px;
            background: #fff;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 32px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .logo-svg {
            width: 48px;
            height: 48px;
        }

        .connect-title {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        .connect-subtitle {
            font-size: 18px;
            color: rgba(255,255,255,0.9);
            margin-bottom: 48px;
            line-height: 1.5;
        }

        .connect-button {
            background: #fff;
            color: #667eea;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
        }

        .connect-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(0,0,0,0.2);
        }

        .connect-button:active {
            transform: translateY(0);
        }

        .instagram-icon {
            width: 24px;
            height: 24px;
        }

        /* Screen 2: Loading Screen */
        .loading-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            background: #ffffff;
        }

        .loading-screen.active {
            display: flex;
        }

        .loading-content {
            text-align: center;
            max-width: 480px;
        }

        .loading-logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 32px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.05);
            }
        }

        .loading-title {
            font-size: 28px;
            font-weight: 700;
            color: #232b39;
            margin-bottom: 48px;
        }

        .loading-steps {
            display: flex;
            flex-direction: column;
            gap: 24px;
            max-width: 400px;
            margin: 0 auto;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 16px;
            text-align: left;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        .step.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .step-icon {
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .step-icon.pending {
            border: 2px solid #e1e5ea;
        }

        .step-icon.active {
            background: #6b4ce6;
            animation: pulse-dot 1.5s ease-in-out infinite;
        }

        .step-icon.completed {
            background: #0bcb6b;
        }

        @keyframes pulse-dot {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.7;
                transform: scale(1.1);
            }
        }

        .checkmark {
            width: 14px;
            height: 14px;
        }

        .step-text {
            font-size: 16px;
            color: #8592a3;
            font-weight: 500;
        }

        .step.visible .step-text {
            color: #232b39;
        }

        .step.completed .step-text {
            font-weight: 600;
        }

        /* Tablet/Desktop */
        @media (min-width: 768px) {
            .connect-screen,
            .loading-screen {
                max-width: 480px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>
    <!-- Screen 1: Connect Instagram -->
    <div class="connect-screen" id="connectScreen">
        <div class="connect-content">
            <div class="logo-container">
                <svg class="logo-svg" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M25.7861 16.9131C29.3976 16.9133 30.1151 21.1147 29.8652 25.6611C29.8478 28.3295 28.725 36.0244 28.7178 36.0742H20.5723C20.6086 35.9976 26.2041 24.1947 24.2109 23.4473C21.2487 22.4267 18.0851 36.0442 18.0752 36.0869H11.9062V24.5762H8.83887V36.0869H3.08984V18.8223H17.4746V25.1035C17.495 25.0411 20.1552 16.9183 25.6055 16.918L25.7861 16.9131Z" fill="#667eea"/>
                    <path d="M39.5 10C39.7495 11.1976 40.1886 12.3188 40.7842 13.3242C41.5773 14.6632 42.6476 15.7976 43.915 16.6357C44.5982 17.0875 45.3387 17.4533 46.124 17.7188C46.1722 17.735 46.221 17.7511 46.2695 17.7666L47 18L46.2695 18.2334C46.221 18.2489 46.1722 18.265 46.124 18.2812C45.3387 18.5467 44.5982 18.9125 43.915 19.3643C42.6476 20.2024 41.5773 21.3368 40.7842 22.6758C40.1886 23.6812 39.7495 24.8024 39.5 26C39.2505 24.8024 38.8114 23.6812 38.2158 22.6758C37.4227 21.3368 36.3524 20.2024 35.085 19.3643C34.4018 18.9125 33.6613 18.5467 32.876 18.2812C32.8278 18.265 32.779 18.2489 32.7305 18.2334L32 18L32.7305 17.7666C32.779 17.7511 32.8278 17.735 32.876 17.7188C33.6613 17.4533 34.4018 17.0875 35.085 16.6357C36.3524 15.7976 37.4227 14.6632 38.2158 13.3242C38.8114 12.3188 39.2505 11.1976 39.5 10Z" fill="#667eea"/>
                </svg>
            </div>

            <h1 class="connect-title">Welcome to Manychat AI</h1>
            <p class="connect-subtitle">
                Connect your Instagram to get started with AI-powered automation
            </p>

            <button class="connect-button" onclick="startOnboarding()">
                <svg class="instagram-icon" viewBox="0 0 24 24" fill="none">
                    <rect x="2" y="2" width="20" height="20" rx="5" stroke="currentColor" stroke-width="2"/>
                    <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/>
                    <circle cx="18" cy="6" r="1" fill="currentColor"/>
                </svg>
                Connect Instagram
            </button>
        </div>
    </div>

    <!-- Screen 2: Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-content">
            <svg class="loading-logo" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M25.7861 16.9131C29.3976 16.9133 30.1151 21.1147 29.8652 25.6611C29.8478 28.3295 28.725 36.0244 28.7178 36.0742H20.5723C20.6086 35.9976 26.2041 24.1947 24.2109 23.4473C21.2487 22.4267 18.0851 36.0442 18.0752 36.0869H11.9062V24.5762H8.83887V36.0869H3.08984V18.8223H17.4746V25.1035C17.495 25.0411 20.1552 16.9183 25.6055 16.918L25.7861 16.9131Z" fill="#232B39"/>
                <path d="M39.5 10C39.7495 11.1976 40.1886 12.3188 40.7842 13.3242C41.5773 14.6632 42.6476 15.7976 43.915 16.6357C44.5982 17.0875 45.3387 17.4533 46.124 17.7188C46.1722 17.735 46.221 17.7511 46.2695 17.7666L47 18L46.2695 18.2334C46.221 18.2489 46.1722 18.265 46.124 18.2812C45.3387 18.5467 44.5982 18.9125 43.915 19.3643C42.6476 20.2024 41.5773 21.3368 40.7842 22.6758C40.1886 23.6812 39.7495 24.8024 39.5 26C39.2505 24.8024 38.8114 23.6812 38.2158 22.6758C37.4227 21.3368 36.3524 20.2024 35.085 19.3643C34.4018 18.9125 33.6613 18.5467 32.876 18.2812C32.8278 18.265 32.779 18.2489 32.7305 18.2334L32 18L32.7305 17.7666C32.779 17.7511 32.8278 17.735 32.876 17.7188C33.6613 17.4533 34.4018 17.0875 35.085 16.6357C36.3524 15.7976 37.4227 14.6632 38.2158 13.3242C38.8114 12.3188 39.2505 11.1976 39.5 10Z" fill="#232B39"/>
            </svg>

            <h2 class="loading-title">Getting your AI ready...</h2>

            <div class="loading-steps">
                <div class="step" id="step1">
                    <div class="step-icon pending" id="icon1"></div>
                    <div class="step-text">Scanning your Instagram bio...</div>
                </div>
                <div class="step" id="step2">
                    <div class="step-icon pending" id="icon2"></div>
                    <div class="step-text">Analyzing your Instagram posts...</div>
                </div>
                <div class="step" id="step3">
                    <div class="step-icon pending" id="icon3"></div>
                    <div class="step-text">Reading your Instagram messages...</div>
                </div>
                <div class="step" id="step4">
                    <div class="step-icon pending" id="icon4"></div>
                    <div class="step-text">Setting up your AI assistant...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentStep = 0;
        const steps = [
            { id: 'step1', iconId: 'icon1', duration: 7000 },
            { id: 'step2', iconId: 'icon2', duration: 7000 },
            { id: 'step3', iconId: 'icon3', duration: 8000 },
            { id: 'step4', iconId: 'icon4', duration: 8000 }
        ];

        function startOnboarding() {
            // Hide connect screen
            document.getElementById('connectScreen').classList.add('hidden');

            // Show loading screen
            document.getElementById('loadingScreen').classList.add('active');

            // Start the loading sequence
            runStep(0);
        }

        function runStep(stepIndex) {
            if (stepIndex >= steps.length) {
                // All steps complete - could redirect or show next screen
                console.log('Onboarding complete!');
                return;
            }

            const step = steps[stepIndex];
            const stepElement = document.getElementById(step.id);
            const iconElement = document.getElementById(step.iconId);

            // Make step visible
            stepElement.classList.add('visible');

            // Set icon to active
            iconElement.classList.remove('pending');
            iconElement.classList.add('active');

            // After duration, mark as complete and move to next
            setTimeout(() => {
                iconElement.classList.remove('active');
                iconElement.classList.add('completed');

                // Add checkmark SVG
                iconElement.innerHTML = `
                    <svg class="checkmark" viewBox="0 0 12 10" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M1 5L4.5 8.5L11 1.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                `;

                stepElement.classList.add('completed');

                // Move to next step
                runStep(stepIndex + 1);
            }, step.duration);
        }
    </script>
</body>
</html>
